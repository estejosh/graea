[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graea"
version = "0.1.2"
description = "Give any LLM eyes on a Telegram bot: MTProto + screenshots + vision reader + DuckDB memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic-2.0" }
dependencies = [
  "telethon>=1.36",
  "playwright>=1.45",
  "duckdb>=1.0",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27",
  "mcp>=1.2,<2",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "pytz>=2024.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
demo = ["python-telegram-bot>=21.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/estejosh/graea"
Repository = "https://github.com/estejosh/graea"
Changelog = "https://github.com/estejosh/graea/blob/main/CHANGELOG.md"

[project.scripts]
graea = "graea.interfaces.cli:app"
graea-mcp = "graea.interfaces.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["graea"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set so a newer ruff on CI does not fail the build on style churn.
select = ["E4", "E7", "E9", "F"]
